# 构建后端：hatchling 是新一代 Python 打包工具，原生支持 src-layout
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zxedu-aiops"
version = "0.1.0"
description = "AI ops-tools collection: asyncio web server with CLI, admin UI, and plugin modules"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# 依赖只声明下限、不锁版本（库风格发布，锁版本是 uv.lock 开发环境的事）
dependencies = [
    "fastapi>=0.139",
    "uvicorn>=0.51",
    "psutil>=7.0",
    "ruamel.yaml>=0.18",
]

# CLI 命令的出生证明：安装后生成 zxedu-aiops 可执行命令 → 调用 cli.py 的 main()
[project.scripts]
zxedu-aiops = "zxedu_aiops.cli:main"

# wheel 打包：告诉 hatchling 源码在 src/ 下
[tool.hatch.build.target.wheel]
packages = ["src/zxedu_aiops"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","C4","SIM","PGH"]

# 把 zxedu_aiops 标记为第一方包，isort 排 import 时和第三方库分开
[tool.ruff.lint.isort]
known-first-party = ["zxedu_aiops"]

[tool.pytest.ini_options]
# auto 模式：async def 测试函数自动获得事件循环，不用手写 @pytest.mark.asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]